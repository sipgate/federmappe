product:
  type: lib
  platforms:
    - android

dependencies:
  - $libs.kotlinx.datetime

test-dependencies:
  - $libs.mockk.agent

settings:
  jvm:
    release: 17
  kotlin:
    serialization:
      enabled: true
  android:
    namespace: "de.sipgate.federmappe.common"
  publishing:
    artifactId: common

test-settings:
  kotlin:
    optIns:
      - kotlinx.serialization.ExperimentalSerializationApi
      - kotlin.time.ExperimentalTime

apply:
  - ../publish.module-template.yaml
